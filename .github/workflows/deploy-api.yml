# OPT-IN (manual only). Builds and deploys the API to Cloud Run via infra/cloudrun/deploy.sh.
# Required repository secret:   GCP_SA_KEY  — JSON key of a service account with roles:
#                               run.admin, cloudbuild.builds.editor, artifactregistry.admin, secretmanager.admin,
#                               storage.admin, serviceusage.serviceUsageAdmin, iam.serviceAccountUser
# Required repository variable: GCP_PROJECT_ID (= the Firebase project id)
# Secrets DATABASE_URL / EVENTS_SHARED_SECRET / REPORT_HMAC_SECRET must already exist in Secret Manager
# (create them once locally with `make deploy-api` and infra/cloudrun/secrets.env), or add the optional
# repository secrets below and the workflow writes secrets.env for deploy.sh.
name: Deploy API (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Cloud Run region"
        default: asia-south1
        required: true
      skip_build:
        description: "Redeploy the last built image without rebuilding"
        type: boolean
        default: false

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Hoisted to job env because the `secrets` context is not available in a step `if:`.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      EVENTS_SHARED_SECRET: ${{ secrets.EVENTS_SHARED_SECRET }}
      REPORT_HMAC_SECRET: ${{ secrets.REPORT_HMAC_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Materialise secrets.env (optional repository secrets)
        if: ${{ env.NEON_DATABASE_URL != '' }}
        run: |
          {
            echo "DATABASE_URL=$NEON_DATABASE_URL"
            echo "EVENTS_SHARED_SECRET=$EVENTS_SHARED_SECRET"
            echo "REPORT_HMAC_SECRET=$REPORT_HMAC_SECRET"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
          } > infra/cloudrun/secrets.env

      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ github.event.inputs.region }}
          SKIP_BUILD: ${{ github.event.inputs.skip_build == 'true' && '1' || '0' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
        run: |
          # empty vars fall back to deploy.sh defaults (https://$PROJECT_ID.web.app)
          [ -n "$CORS_ORIGINS" ] || unset CORS_ORIGINS
          [ -n "$PUBLIC_WEB_URL" ] || unset PUBLIC_WEB_URL
          ./infra/cloudrun/deploy.sh
