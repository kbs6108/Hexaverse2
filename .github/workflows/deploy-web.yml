# OPT-IN. Deploys apps/web to Firebase Hosting.
# Required repository secret:   FIREBASE_SERVICE_ACCOUNT  (JSON of a service account with "Firebase Hosting Admin";
#                               `firebase init hosting:github` creates one, or IAM → Service Accounts → key)
# Required repository variables: FIREBASE_PROJECT_ID, VITE_API_URL, VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#                               VITE_FIREBASE_APP_ID ; optional: VITE_ESRI_API_KEY, VITE_DEFAULT_CENTER, VITE_DEFAULT_ZOOM
# Runs on manual dispatch, and on push to main only when the secret is configured.
name: Deploy web (Firebase Hosting)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Hosting channel (live or a preview channel id)"
        default: live
        required: true
  push:
    branches: [main]
    paths: ["apps/web/**", "firebase.json", ".github/workflows/deploy-web.yml"]

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FIREBASE_PROJECT_ID != '' }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH_MODE: firebase
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ESRI_API_KEY: ${{ vars.VITE_ESRI_API_KEY }}
          VITE_DEFAULT_CENTER: ${{ vars.VITE_DEFAULT_CENTER || '80.5560,16.4420' }}
          VITE_DEFAULT_ZOOM: ${{ vars.VITE_DEFAULT_ZOOM || '15' }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Strip predeploy hooks (already built above)
        run: python3 -c "import json;d=json.load(open('firebase.json'));d['hosting'].pop('predeploy',None);json.dump(d,open('firebase.json','w'),indent=2)"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.event.inputs.channel || 'live' }}
