[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landstack-api"
version = "0.1.0"
description = "Land Stack gateway API + six mock department services (SIH 2026 prototype)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
  "firebase-admin>=6.5",
  "pyyaml>=6",
  "weasyprint>=62",
  "segno>=1.6",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
raster = ["rasterio>=1.3", "rasterstats>=0.19", "numpy>=1.26"]
gcs = ["google-cloud-storage>=2.16"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["landstack*", "departments*", "ai*"]

[tool.setuptools.package-data]
landstack = ["adapters/mappings/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs DATABASE_URL (PostGIS); skipped otherwise"]
filterwarnings = ["ignore::DeprecationWarning"]
