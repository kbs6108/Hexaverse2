source: "AP CDMA Property Tax (mock)"
department: fiscal
state: AP
id_field: ulpin
endpoints:
  tax: {path: /fiscal/tax, params: {ulpin: "{ulpin}"}}
  valuation: {path: /fiscal/valuation, params: {ulpin: "{ulpin}"}}
map:
  tax.item.assessment_no: fiscal.tax.assessment_no
  tax.item.annual_demand: fiscal.tax.annual_demand
  tax.item.arrears: fiscal.tax.arrears
  tax.item.paid_till: fiscal.tax.paid_till
  tax.item.last_paid_on: fiscal.tax.last_paid_on
  valuation.item.guideline_value_per_sqm: fiscal.guideline_value_per_sqm
  valuation.item.market_value_per_sqm: fiscal.market_value_per_sqm
  valuation.item.base_rate_per_sqm: fiscal.base_rate_per_sqm
  valuation.item.road_factor: fiscal.road_factor
  valuation.item.infra_factor: fiscal.infra_factor
  valuation.item.zone_factor: fiscal.zone_factor
  valuation.item.location_tier: fiscal.location_tier
  valuation.item.effective_from: fiscal.guideline_effective_from
