# Builds apps/api/Dockerfile with the REPO ROOT as context (the image needs tools/ and db/ too).
# Used by infra/cloudrun/deploy.sh:  gcloud builds submit . --config infra/cloudrun/cloudbuild.yaml --substitutions _IMAGE=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_IMAGE}
      - --cache-from
      - ${_IMAGE_LATEST}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [tag, "${_IMAGE}", "${_IMAGE_LATEST}"]
images:
  - ${_IMAGE}
  - ${_IMAGE_LATEST}
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/PROJECT/landstack/landstack-api:manual
  _IMAGE_LATEST: asia-south1-docker.pkg.dev/PROJECT/landstack/landstack-api:latest
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
