# Knative Service manifest — alternative to deploy.sh:
#   sed -e 's/PROJECT_ID/my-project/g' -e 's/IMAGE_TAG/latest/g' infra/cloudrun/service.yaml \
#     | gcloud run services replace - --region asia-south1
# Secrets must already exist in Secret Manager (DATABASE_URL, EVENTS_SHARED_SECRET, REPORT_HMAC_SECRET, GEMINI_API_KEY).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: landstack-api
  labels:
    app: landstack
    env: demo
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/landstack/landstack-api:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: AUTH_MODE
              value: firebase
            - name: FIREBASE_PROJECT_ID
              value: PROJECT_ID
            - name: CORS_ORIGINS
              value: https://PROJECT_ID.web.app,https://PROJECT_ID.firebaseapp.com
            - name: PUBLIC_WEB_URL
              value: https://PROJECT_ID.web.app
            - name: STORAGE_BACKEND
              value: gcs
            - name: GCS_BUCKET
              value: PROJECT_ID-landstack-reports
            - name: S2_OFFLINE
              value: "1"
            - name: DEPT_BASE_URL
              value: ""
            - name: DEPT_TIMEOUT_S
              value: "0.3"
            - name: LOG_LEVEL
              value: INFO
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: EVENTS_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: EVENTS_SHARED_SECRET
                  key: latest
            - name: REPORT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: REPORT_HMAC_SECRET
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 60
  traffic:
    - percent: 100
      latestRevision: true
